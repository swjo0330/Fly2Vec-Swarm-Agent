const droneColors = [
  Cesium.Color.fromCssColorString('#2196F3'),
  Cesium.Color.fromCssColorString('#E91E63'),
  Cesium.Color.fromCssColorString('#4CAF50'),
  Cesium.Color.fromCssColorString('#FF9800'),
  Cesium.Color.fromCssColorString('#9C27B0'),
];

function clearAll() {
  viewer.entities.removeAll();
}

function addDronePath(drone, idx, scenarioKey) {
  const color = droneColors[idx % droneColors.length];

  // 비행 경로 (지면 위 고도)
  const positions = drone.lats.map((lat, i) =>
    Cesium.Cartesian3.fromDegrees(drone.lngs[i], lat, drone.alts[i])
  );

  viewer.entities.add({
    polyline: {
      positions: positions,
      width: 4,
      material: color,
      clampToGround: false,
    },
  });

  // 지면 그림자
  viewer.entities.add({
    polyline: {
      positions: drone.lats.map((lat, i) =>
        Cesium.Cartesian3.fromDegrees(drone.lngs[i], lat)
      ),
      width: 2,
      material: color.withAlpha(0.2),
      clampToGround: true,
    },
  });

  // WP 마커
  for (let i = 0; i < drone.lats.length; i++) {
    const isStart = i === 0;
    const isEnd = i === drone.lats.length - 1;
    viewer.entities.add({
      position: Cesium.Cartesian3.fromDegrees(drone.lngs[i], drone.lats[i], drone.alts[i]),
      point: {
        pixelSize: isStart || isEnd ? 10 : 5,
        color: color,
        outlineColor: Cesium.Color.WHITE,
        outlineWidth: isStart || isEnd ? 2 : 1,
        heightReference: Cesium.HeightReference.RELATIVE_TO_GROUND,
        disableDepthTestDistance: Number.POSITIVE_INFINITY,
      },
      label: isStart ? {
        text: 'D' + (idx+1) + ' (' + drone.alts[i].toFixed(0) + 'm AGL)',
        font: '12px Apple SD Gothic Neo',
        fillColor: Cesium.Color.WHITE,
        style: Cesium.LabelStyle.FILL_AND_OUTLINE,
        outlineWidth: 2,
        verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
        pixelOffset: new Cesium.Cartesian2(0, -14),
        heightReference: Cesium.HeightReference.RELATIVE_TO_GROUND,
        disableDepthTestDistance: Number.POSITIVE_INFINITY,
      } : undefined,
    });
  }
}

function showScenario(key) {
  clearAll();
  const s = scenarios[key];
  s.drones.forEach((drone, idx) => addDronePath(drone, idx, key));

  viewer.camera.flyTo({
    destination: Cesium.Cartesian3.fromDegrees(s.center[1], s.center[0], 3000),
    orientation: {
      heading: Cesium.Math.toRadians(0),
      pitch: Cesium.Math.toRadians(-45),
      roll: 0,
    },
    duration: 1.5,
  });
}

function showAll() {
  clearAll();
  let allLat = 0, allLon = 0, cnt = 0;
  Object.entries(scenarios).forEach(([key, s]) => {
    s.drones.forEach((drone, idx) => addDronePath(drone, idx, key));
    allLat += s.center[0]; allLon += s.center[1]; cnt++;
  });
  viewer.camera.flyTo({
    destination: Cesium.Cartesian3.fromDegrees(allLon/cnt, allLat/cnt, 50000),
    orientation: { heading: 0, pitch: Cesium.Math.toRadians(-60), roll: 0 },
    duration: 1.5,
  });
}

// 초기 화면: cooperative_search
showScenario('cooperative_search');
