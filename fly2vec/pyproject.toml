[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["fly2vec*"]

[project]
name = "fly2vec"
version = "0.1.0"
description = "R-GAT 기반 군집 드론 임무 그래프의 공간적 의미 학습 및 지능형 임무 계획 분석 에이전트 체계"
requires-python = ">=3.12,<3.13"
authors = [{name = "조성원"}, {name = "이서정"}]

dependencies = [
    # Agent Framework
    "langgraph>=0.6.11",
    "langchain>=0.3.27",
    "langchain-core>=1.2.0",
    "langchain-openai>=0.3.35",
    "langchain-anthropic>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-mcp-adapters>=0.2.0",
    "a2a-sdk[grpc,http-server]>=0.3.22",
    "fastmcp>=2.14.1,<3",

    # GNN / Embedding
    "torch>=2.2.0",
    "torch-geometric>=2.5.0",
    "gensim>=4.3.0",
    "node2vec>=0.4.0",
    "networkx>=3.2",

    # Vector DB
    "qdrant-client>=1.12.0",

    # Analysis
    "scikit-learn>=1.4.0",
    "hdbscan>=0.8.33",
    "umap-learn>=0.5.5",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "pandas>=2.2.0",
    "matplotlib>=3.9.0",

    # Infrastructure
    "python-dotenv>=1.2.0",
    "structlog>=25.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.28.0",
    "fastapi>=0.127.0",
    "uvicorn>=0.40.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
